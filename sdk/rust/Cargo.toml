[package]
name = "zeris-sdk"
version = "0.1.0"
description = "Rust SDK for Zeris Zero-Knowledge Resolution & Integrity System"
edition = "2021"

[dependencies]
solana-client = "1.16"
solana-sdk = "1.16"
solana-program = "1.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
base64 = "0.21"
sha2 = "0.10"